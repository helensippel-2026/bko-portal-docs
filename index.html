* { box-sizing: border-box; margin: 0; padding: 0; }

html { height: 100%; }

body {
  font-family: 'Roboto', Arial, sans-serif;
  font-size: 14.5px;
  letter-spacing: 0.17px;
  color: #454559;
  background: #F0F2F7;
  display: flex;
  flex-direction: column;
  align-items: center;
  min-height: 100vh;
  overflow-y: scroll;
}

/* TOPBAR */
.topbar {
  width: 100%; background: #fff; border-bottom: 1px solid #E0E2EB;
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 2rem; height: 52px; flex-shrink: 0;
  position: sticky; top: 0; z-index: 100;
}
.topbar-brand { display: flex; align-items: center; gap: 10px; }
.topbar-logo {
  width: 28px; height: 28px; background: #1A76FF; border-radius: 7px;
  display: flex; align-items: center; justify-content: center;
}
.topbar-logo svg { width: 16px; height: 16px; display: block; }
.topbar-name { font-size: 14px; font-weight: 700; color: #0F172A; }
.topbar-title { font-size: 13px; color: #6F6F84; border-left: 1px solid #E0E2EB; padding-left: 14px; margin-left: 4px; }
.topbar-right { display: flex; align-items: center; gap: 10px; }
.tbtn {
  font-size: 12px; font-weight: 500; color: #454559; background: #F5F6FA;
  border: 1px solid #E0E2EB; border-radius: 7px; padding: 6px 14px;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
}
.tbtn:hover { background: #E0E2EB; }
.tbtn-primary { background: #1A76FF; color: #fff; border-color: #1A76FF; }
.tbtn-primary:hover { background: #0064FA; }

/* STAGE */
.stage {
  flex: 1; display: flex; flex-direction: column; align-items: center;
  padding: 2.5rem 1.5rem 5rem; width: 100%; gap: 1.5rem;
}

/* NAV BAR */
.nav-bar {
  display: flex; align-items: center; justify-content: space-between;
  width: 100%; max-width: 860px; gap: 12px;
}
.nav-arrows { display: flex; align-items: center; gap: 8px; }
.nav-btn {
  font-size: 12px; font-weight: 500; color: #454559; background: #F5F6FA;
  border: 1px solid #E0E2EB; border-radius: 7px; padding: 7px 14px;
  cursor: pointer; display: flex; align-items: center; gap: 5px;
}
.nav-btn:hover:not(:disabled) { background: #E0E2EB; }
.nav-btn:disabled { opacity: .3; cursor: default; }
.nav-counter { font-size: 13px; font-weight: 700; color: #6F6F84; }
.nav-dots { display: flex; align-items: center; gap: 5px; }
.ndot { width: 6px; height: 6px; border-radius: 50%; background: #C0C5D4; border: none; cursor: pointer; padding: 0; transition: all .2s; }
.ndot.active { background: #0064FA; width: 20px; border-radius: 3px; }
.nav-slide-title { font-size: 12px; color: #6F6F84; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 260px; }

/* LAYOUT */
.layout { display: flex; align-items: flex-start; width: 100%; max-width: 1040px; }
.sidebar { width: 191px; flex-shrink: 0; padding: 0 12px 0 0; }
.thumb-list { display: flex; flex-direction: column; gap: 6px; position: sticky; top: 72px; }
.thumb {
  background: #F5F6FA; border: 1px solid #E0E2EB; border-radius: 8px;
  height: 56px; box-sizing: border-box;
  padding: 8px 10px; cursor: pointer; display: flex; align-items: center; gap: 8px;
  transition: all .15s;
}
.thumb:hover { border-color: #A6A8B9; }
.thumb.active { border-color: #1A76FF; background: rgba(26,118,255,.06); }
.thumb-num { font-size: 13px; font-weight: 700; color: #9099B2; min-width: 18px; }
.thumb.active .thumb-num { color: #1A76FF; }
.thumb-label { font-size: 13px; color: #6F6F84; line-height: 1.35; }
.thumb.active .thumb-label { color: #0F172A; font-weight: 600; }
.main-area { flex: 1; min-width: 0; }

/* SLIDE CARD */
.slide-card {
  width: 100%; background: #fff; border: 1px solid #E0E2EB;
  border-radius: 16px; overflow: hidden;
  animation: slideIn .2s ease;
}

@keyframes slideIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.slide-body { padding: 2.5rem 2.5rem 2rem; }

/* CONTENT COMPONENTS */
.cover-title { font-family: 'Sora', Arial, sans-serif; font-size: 38px; font-weight: 800; color: #0F172A; line-height: 1.1; letter-spacing: -.03em; margin-bottom: .8rem; }
.cover-title .accent { color: #0064FA; }
.cover-desc { font-size: 15px; color: #454559; line-height: 1.75; max-width: 540px; margin-bottom: 2rem; }
.cover-hr { height: 1px; background: #E0E2EB; margin-bottom: 1.2rem; }
.cover-meta { font-size: 12px; color: #9099B2; display: flex; align-items: center; gap: 6px;   font-family: 'Roboto', Arial, sans-serif;
}
.cover-meta svg { width: 14px; height: 14px; flex-shrink: 0; display: block; }

.sec-block { margin-bottom: 2.8rem; }
.sec-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #9099B2; margin-bottom: .5rem; }
.sec-heading { font-family: 'Sora', Arial, sans-serif; font-size: 28px; font-weight: 800; color: #0F172A; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 24px; }
.sec-heading .accent { color: #0064FA; }
.sec-subheading { font-family: 'Sora', Arial, sans-serif; font-size: 22px; font-weight: 600; color: #0F172A; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 24px; }
.sec-subheading .accent { color: #0F172A; }
.sec-body {font-size: 16px;  line-height: 1.75; max-width: 714px;   font-family: 'Roboto', Arial, sans-serif;
}
.sec-body strong { font-weight: 500; }
.sec-divider { height: 1px; background: #E0E2EB; margin: 2.4rem 0; }

.quote-block { background: #0F172A; border-radius: 12px; padding: 2rem 2.4rem; margin-bottom: 2rem; }
.quote-label { font-size: 11px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; color: #6F6F84; margin-bottom: 1rem; }
.quote-text { font-size: 17px; font-weight: 600; color: #fff; line-height: 1.65; font-style: italic; }

.vtable-wrap { overflow-x: auto; }
.vtable { width: 100%; border-collapse: collapse; }
.vtable th { text-align: left; padding: 9px 12px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #6F6F84; border-bottom: 1px solid #E0E2EB; }
.vtable td { padding: 11px 12px; border-bottom: 1px solid #E0E2EB; color: #454559; line-height: 1.5; }
.vtable tr:last-child td { border-bottom: none; }
.vtable tr:hover td { background: rgba(26,118,255,.03); }

.two-col-text { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 1.2rem; }
.col-card { background: #F5F6FA; border: 1px solid #E0E2EB; border-radius: 10px; padding: 1.2rem 1.3rem; }
.col-card-eyebrow { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .5rem; }
.col-card-title { font-size: 15px; font-weight: 800; color: #0F172A; margin-bottom: .5rem; }
.col-card-body { line-height: 1.65; }

.conclusion-box { background: #F5F6FA; border: 1px solid #E0E2EB; border-radius: 12px; padding: 1.4rem 1.6rem; margin-top: 1.2rem; line-height: 1.75; }
.conclusion-box strong { color: #0F172A; }

.guideline-list { display: flex; flex-direction: column; margin-top: 1.2rem; }
.guideline-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #E0E2EB; }
.guideline-item:last-child { border-bottom: none; }
.guideline-num { font-size: 12px; font-weight: 800; color: #fff; background: #1A76FF; width: 26px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.guideline-title { font-size: 14px; font-weight: 700; color: #0F172A; margin-bottom: 3px; }
.guideline-body {font-size: 16px;  color: #6F6F84; line-height: 1.65;   font-family: 'Roboto', Arial, sans-serif;
}

.flow-list { display: flex; flex-direction: column; margin-top: 1.2rem; }
.flow-item { display: flex; align-items: flex-start; gap: 14px; padding: 13px 0; border-bottom: 1px solid #E0E2EB; }
.flow-item:last-child { border-bottom: none; }
.flow-step-num { font-size: 12px; font-weight: 800; color: #fff; background: #1A76FF; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px; }
.flow-title { font-size: 14px; font-weight: 700; color: #0F172A; margin-bottom: 2px; }
.flow-body { color: #6F6F84; line-height: 1.6; }

.next-list { display: flex; flex-direction: column; margin-top: 1.2rem; }
.next-item { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 1px solid #E0E2EB; }
.next-item:last-child { border-bottom: none; }
.next-num { font-size: 12px; font-weight: 800; color: #1A76FF; background: #EEF0FD; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.next-title { font-size: 14px; font-weight: 700; color: #0F172A; margin-bottom: 3px; }
.next-body {font-size: 16px;  color: #6F6F84; line-height: 1.6;   font-family: 'Roboto', Arial, sans-serif;
}
.mention { font-size: 11px; color: #1A76FF; background: #EEF0FD; border-radius: 5px; padding: 2px 7px; margin-top: 4px; display: inline-block; margin-right: 4px; }

.ref-list { display: flex; flex-direction: column; gap: 8px; margin-top: 1rem; }
.ref-item { line-height: 1.65; padding: 10px 14px; background: #F5F6FA; border-radius: 8px; border: 1px solid #E0E2EB; }
.ref-item a { color: #1A76FF; word-break: break-all; }

.color-spec-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 1.2rem; }
.color-spec-card { background: #F5F6FA; border: 1px solid #E0E2EB; border-radius: 10px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; }
.color-dot { width: 36px; height: 36px; border-radius: 8px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.08); }
.color-info-label { font-size: 10px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: #9099B2; margin-bottom: 3px; }

<!-- ═══════════════════════════════════════════
     SEÇÃO 0: INTRODUÇÃO
════════════════════════════════════════════ -->
<div class="sec-block">
  <span class="slide-eyebrow">MAR - ABR · 2026</span><h2 class="sec-heading">Identidade Visual e <span class="accent">Primeiros Passos</span></h2>
  <p class="sec-body">Esta seção documenta as decisões iniciais que fundamentaram o design do Portal BKO — desde a distinção entre frontoffice e backoffice até a escolha do modo visual, passando pelos guidelines que orientam toda a interface.</p>
</div>

<div class="sec-divider"></div>

<!-- ═══════════════════════════════════════════
     SEÇÃO 1: FRONTOFFICE vs BACKOFFICE
════════════════════════════════════════════ -->
<div class="sec-block">
  <h3 class="sec-subheading">Frontoffice <span class="accent">&amp; Backoffice</span></h3>
  <p class="sec-body">Antes de construir qualquer identidade visual, precisávamos entender o contexto de uso. Um backoffice não é um produto de marketing — é uma ferramenta de trabalho usada por horas a fio. Essa distinção foi o ponto de partida para todas as decisões que vieram depois.</p>

  <div class="vtable-wrap" style="margin-top:1.2rem;">
  <table class="vtable">
    <thead><tr><th>Atributo</th><th>Frontoffice (Interface do Cliente/Vendas)</th><th>Backoffice (Interface Administrativa)</th></tr></thead>
    <tbody>
      <tr><td>Objetivo Primário</td><td>Crescimento, Geração de Receita, Branding</td><td>Eficiência Operacional, Controle, Redução de Custos</td></tr>
      <tr><td>Público-Alvo</td><td>Clientes, leads, equipes de vendas e marketing</td><td>Administradores, analistas de TI, RH e financeiro</td></tr>
      <tr><td>Métricas de Performance</td><td>NPS, CSAT, Taxa de Conversão, Engajamento</td><td>MTTR, Eficiência de Tarefa, Precisão de Dados</td></tr>
      <tr><td>Ambiente de Trabalho</td><td>Dinâmico, persuasivo, focado em emoção</td><td>Estruturado, orientado a procedimentos e dados</td></tr>
      <tr><td>Frequência de Uso</td><td>Episódica ou transacional</td><td>Sustentada (8 horas por dia)</td></tr>
      <tr><td>Interação com Dados</td><td>Consumo simplificado, visualização de alto nível</td><td>Manipulação complexa, CRUD, auditoria</td></tr>
    </tbody>
  </table>
  </div>
</div>

<div class="sec-divider"></div>

<!-- ═══════════════════════════════════════════
     SEÇÃO 2: DARK MODE — HIPÓTESE
════════════════════════════════════════════ -->
<div class="sec-block">
  <h3 class="sec-subheading">Light mode vs. <span class="accent">Dark mode</span></h3>

  <div class="quote-block">
    <div class="quote-label">Hipótese inicial</div>
    <p class="quote-text">"Nossos usuários consomem uma quantidade de dados muito grande e por muito tempo, então o Dark Mode (modo escuro) traria mais conforto."</p>
  </div>

  <p class="sec-body">A partir dessa hipótese, iniciamos uma pesquisa para entender se dark mode realmente entrega o que promete — especialmente no contexto de um backoffice com alta densidade de informação.</p>

  <div class="two-col-text" style="margin-top:1.2rem;">
    <div style="background:#F5F6FA;border:1px solid #E0E2EB;border-radius:10px;padding:1.2rem;">
      <div style="font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9099B2;margin-bottom:.8rem;">Preferência por dark mode</div>
      <table class="vtable">
        <thead><tr><th>Demográfico</th><th>Preferência</th><th>Motivação principal</th></tr></thead>
        <tbody>
          <tr><td>Homens</td><td style="font-weight:700;color:#0F172A;">75,3%</td><td>Apelo estético, visual moderno</td></tr>
          <tr><td>Mulheres</td><td style="font-weight:700;color:#0F172A;">62,7%</td><td>Redução de fadiga e conforto visual</td></tr>
          <tr><td>18–22 anos</td><td style="font-weight:700;color:#0F172A;">74,5%</td><td>Modernidade, cultura gamer/tech</td></tr>
          <tr><td>31–45 anos</td><td style="font-weight:700;color:#0F172A;">53,3%</td><td>Maior dependência do light mode</td></tr>
        </tbody>
      </table>
    </div>
    <div style="background:#FFF0F0;border:1px solid #FECACA;border-radius:10px;padding:1.2rem;">
      <div style="font-family:inherit;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#B91C1C;margin-bottom:.5rem;">Conforto visual ≠ Eficiência cognitiva</div>
      <div style="font-family:'Roboto',Arial,sans-serif;font-size:13px;font-weight:700;color:#0F172A;margin-bottom:.8rem;">O que os dados dizem</div>
      <div style="display:flex;flex-direction:column;gap:8px;">
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #FECACA;">
          <span style="font-family:'Roboto',Arial,sans-serif;font-size:20px;font-weight:800;color:#DC2626;min-width:60px;">−8,3%</span>
          <span style="color:#7F1D1D;line-height:1.4;">velocidade de leitura sustentada em dark mode</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #FECACA;">
          <span style="font-family:'Roboto',Arial,sans-serif;font-size:20px;font-weight:800;color:#DC2626;min-width:60px;">+22%</span>
          <span style="color:#7F1D1D;line-height:1.4;">incidência de erros de reconhecimento de caracteres</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #FECACA;">
          <span style="font-family:'Roboto',Arial,sans-serif;font-size:20px;font-weight:800;color:#DC2626;min-width:60px;">+31%</span>
          <span style="color:#7F1D1D;line-height:1.4;">perda de detalhes críticos em ambientes escuros</span>
        </div>
        <div style="display:flex;align-items:center;gap:10px;padding:8px 0;">
          <span style="font-family:'Roboto',Arial,sans-serif;font-size:20px;font-weight:800;color:#DC2626;min-width:60px;">56%</span>
          <span style="color:#7F1D1D;line-height:1.4;">dos apps aplicam WCAG em dark mode de forma qualificada</span>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ═══════════════════════════════════════════
     SEÇÃO 3: DARK MODE — FISIOLOGIA
════════════════════════════════════════════ -->
<div class="sec-block">
  <p class="sec-body">O desempenho do dark mode depende diretamente de como o olho humano processa a informação em diferentes condições de luminosidade.</p>

  <div class="two-col-text">
    <div class="col-card">
      <div class="col-card-eyebrow" style="color:#059669;">Light Mode</div>
      <div class="col-card-title">+ reflexo pupilar</div>
      <div class="col-card-body">Uma pupila reduzida trabalha uma imagem muito mais nítida projetada na retina, facilitando a identificação de detalhes de alta frequência, como glifos tipográficos pequenos e números densos em planilhas.</div>
    </div>
    <div class="col-card">
      <div class="col-card-eyebrow" style="color:#DC2626;">Dark Mode</div>
      <div class="col-card-title">− acuidade visual</div>
      <div class="col-card-body">Uma pupila dilatada reduz a acuidade visual teórica, exigindo que o cérebro realize um esforço compensatório maior para processar a mesma informação que seria trivialmente resolvida em modo claro.</div>
    </div>
    <div class="col-card">
      <div class="col-card-eyebrow" style="color:#6F6F84;">Iluminação</div>
      <div class="col-card-title">Contexto importa</div>
      <div class="col-card-body">Objetivo do dark mode é diminuir o contraste entre a tela e o ambiente. Ambiente claro = light mode. Ambiente escuro = dark mode. O contexto de uso define qual é o mais adequado.</div>
    </div>
    <div class="col-card">
      <div class="col-card-eyebrow" style="color:#D97706;">Acessibilidade</div>
      <div class="col-card-title">Astigmatismo</div>
      <div class="col-card-body">Ambientes em polaridade negativa podem ser um desafio maior para pessoas usuárias com astigmatismo, comprometendo a legibilidade a longo prazo.</div>
    </div>
  </div>
</div>

<div class="sec-divider"></div>

<!-- ═══════════════════════════════════════════
     SEÇÃO 4+5: DEFINIÇÃO
════════════════════════════════════════════ -->
<div class="sec-block">
  <h2 class="sec-heading">Definição</h2>
  <p class="sec-body">O Dark Mode é uma ferramenta essencial para aplicações modernas, mas não dita uma otimização universal. O modo como ele vai performar depende do <strong>contexto de uso</strong>.</p>
  <p class="sec-body" style="margin-top:.8rem;"><strong>Light mode:</strong> alta produtividade, densidade de dados, ambientes claros.</p>
  <p class="sec-body" style="margin-top:.4rem;"><strong>Dark mode:</strong> imersão, foco, conforto de luzes baixas.</p>
  <p class="sec-body" style="margin-top:.8rem;">Considerando o contexto de trabalho dos stakeholders do BKO, o Dark Mode <strong>não se encaixaria em um nível de prioridade primário</strong>, nem como uma ferramenta padrão de uso.</p>
  <p class="sec-body" style="margin-top:.8rem;">Já para a Identidade Visual geral do novo portal, chegamos às definições:</p>

  <div class="guideline-list" style="margin-top:1.6rem;">
    <div class="guideline-item">
      <div class="guideline-num">1</div>
      <div>
        <div class="guideline-title">Menu lateral com cor profunda</div>
        <div class="guideline-body">Azul ou carvão para garantir escalabilidade e transmitir hierarquia e seriedade. A cor escura do menu diferencia visualmente a área de navegação da área operacional.</div>
      </div>
    </div>
    <div class="guideline-item">
      <div class="guideline-num">2</div>
      <div>
        <div class="guideline-title">Minimalismo em tons de cinza e branco</div>
        <div class="guideline-body">Superfícies neutras facilitam o consumo intenso de informações sem gerar fadiga visual em sessões longas. O conteúdo operacional deve competir com a interface pelo mínimo possível.</div>
      </div>
    </div>
    <div class="guideline-item">
      <div class="guideline-num">3</div>
      <div>
        <div class="guideline-title">Branding corporativo restrito</div>
        <div class="guideline-body">Logotipo Vindi presente de forma discreta. A identidade visual serve à operação — não ao marketing. O portal não precisa se vender, precisa funcionar.</div>
      </div>
    </div>
    <div class="guideline-item">
      <div class="guideline-num">4</div>
      <div>
        <div class="guideline-title">Reduzir paddings para aumentar densidade</div>
        <div class="guideline-body">Espaçamentos reduzidos maximizam a quantidade de informação visível sem scroll. Espaçamento é encontrado onde necessário para hierarquia — não como padrão decorativo.</div>
      </div>
    </div>
  </div>
</div>

` },

{ title: "Dados do Lojista", html: `
<!-- ═══════════════════════════════════════════
     SLIDE 4: DADOS DO LOJISTA — RESEARCH
════════════════════════════════════════════ -->

<!-- SEÇÃO 0: INTRODUÇÃO -->
<div class="sec-block">
  <span class="slide-eyebrow">MAI - JUN · 2026</span><h2 class="sec-heading">Dados do <span class="accent">Lojista</span></h2>
  <p class="sec-body">A tela de dados do lojista é o ponto de entrada para qualquer consulta operacional no portal. Ela centraliza informações cadastrais, financeiras e de status em uma única interface — eliminando a necessidade de transitar entre sistemas para acessar dados básicos do cliente.</p>
</div>

<div class="sec-divider"></div>

<!-- SEÇÃO 1: COMO ERA -->
<div class="sec-block">
  <h3 class="sec-subheading">Versão antiga</h3>
  <p class="sec-body">A ferramenta anterior, helpdesk.pagcerto, apresentava um escopo excessivamente limitado, operando apenas como uma <strong>tela de busca pontual de CNPJ</strong> que redirecionava o analista para uma espécie de espelhamento da Conta Digital do cliente, o gestão.pagcerto.</p>
  <p class="sec-body" style="margin-top:1rem;">Essa limitação gerou um <strong>vício operacional</strong> crítico: a dependência indevida da tela de <strong>Antifraude</strong> em outro sistema legado, o financeiro.pagcerto, para consultas rotineiras. Como o Antifraude concentrava dados mais detalhados e atualizados, analistas de N1, N2, Financeiro e Operações acessavam-no rotineiramente para <strong>checar informações básicas,</strong> como saldo total real, saldo bloqueado e status de produtos.</p>

  <div style="margin-top:1.4rem;border:1px solid #E0E2EB;border-radius:14px;overflow:hidden;">
    <img src="assets/img-2.gif" style="width:100%;height:auto;display:block;" alt="helpdesk.pagcerto — sistema anterior">
  </div>

  <h3 class="sec-subheading" style="font-size:18px;margin-top:2.4rem;">Ineficiência e riscos operacionais</h3>
  <ul class="sec-body" style="margin:0;padding-left:1.2rem;">
    <li>Exposição a <strong>botões operacionais sensíveis</strong>, como bloqueios de saldo e descredenciamento, a perfis que só precisavam de acesso para consulta.</li>
    <li><strong>Saldos defasados</strong> por não abater retenções e bloqueios via MED (Mecanismo Especial de Devolução), exigindo dupla checagem.</li>
    <li>Para saber se um lojista estava com o <strong>Pix ou Cartão bloqueado</strong>, o analista precisava inferir o status observando se o botão de ação na <strong> área do Antifraude</strong> estava desabilitado ou ativo.</li>
    <li>Existência apenas do status "Validado", não deixando claro se a conta está encerrada. Para comprovar o encerramento em auditorias, a equipe precisa realizar <strong>auditorias assistidas</strong>: videochamadas com o auditor, onde se vai navegando a partir do CNPJ até o aviso interno, pois a tela da conta não traz o vínculo com o CNPJ do cliente.</li>
  </ul>
</div>

<div class="sec-divider"></div>

<!-- SEÇÃO 2: NOVA PROPOSTA -->
<div class="sec-block">
  <h3 class="sec-subheading">Nova proposta</h3>
  <p class="sec-body">A área de Dados do Lojista no Novo Portal Unificado Backoffice surge com o objetivo de centralizar a visualização completa do lojista em uma única área, eliminando a dependência do Antifraude e outras áreas sensíveis para meras consultas.</p>
  <p class="sec-body" style="margin-top:1rem;">Na tela de Usuários cadastrados trazemos a substituição de cards por uma tabela densa e escaneável, com busca por nome, documento ou Soft Descriptor. Enquanto a área interna condensa informações de saldo total, saldo bloqueado, e status de risco.</p>

  <div style="margin-top:1.4rem;border:1px solid #E0E2EB;border-radius:14px;overflow:hidden;">
    <img src="assets/img-3.gif" style="width:100%;height:auto;display:block;" alt="Backoffice Unificado BKO — sistema novo">
  </div>

  <h3 class="sec-subheading" style="font-size:18px;margin-top:2.4rem;">Melhorias propostas</h3>
  <ul class="sec-body" style="margin:0;padding-left:1.2rem;">
    <li>A nova tela consolida em uma única visualização o <strong>Saldo Total</strong> e o <strong>Saldo Bloqueado</strong> em tempo real, além dos dados cadastrais básicos e bancários, eliminando a necessidade de entrar diretamente na Conta Digital do cliente para consultas simples.</li>
    <li>Substituição de botões operacionais, que antes seriam acessados pelo Antifraude, por <strong>badges de status</strong> para Conta, Saldo, Pix, Cartão, Boleto e Antecipação.</li>
    <li>O novo layout consolida CNPJ/CPF, Razão Social, Nome Fantasia e status da conta na mesma página. A inclusão da exportação de dados/relatórios em PDF com cabeçalho oficial resolverá de ponta a ponta <strong>exigências de auditoria externa e jurídica</strong>.</li>
    <li>Inclusão de <strong>timeline</strong> (antes acessada pelo Antifraude), com todos os logs de movimentações, edições e exclusões realizadas por parte dos Analistas e Time de Riscos da Vindi.</li>

<div class="sec-divider"></div>

<!-- SEÇÃO 4: CONCLUSÃO -->

  <h3 class="sec-subheading">Conclusão</h3>

  <div style="margin-top:1.4rem;display:flex;flex-direction:column;gap:12px;">

  document.getElementById('prevBtn').disabled = idx === 0;
  document.getElementById('nextBtn').disabled = idx === SLIDES.length - 1;
  document.querySelectorAll('.ndot').forEach((d,i) => d.classList.toggle('active', i===idx));
  document.querySelectorAll('.thumb').forEach((t,i) => t.classList.toggle('active', i===idx));
  if (editMode) applyEdit();
  cur = idx;
  window.scrollTo({top:0, behavior:'smooth'});
}

function navigate(d) { const n=cur+d; if(n>=0 && n<SLIDES.length) render(n); }
function goTo(idx) { render(idx); }

const dc = document.getElementById('navDots');
SLIDES.forEach((_,i) => {
  const d = document.createElement('button');
  d.className = 'ndot' + (i===0?' active':'');
  d.onclick = () => goTo(i);
  dc.appendChild(d);
});

const tl = document.getElementById('thumbList');
SLIDES.forEach((s,i) => {
  const t = document.createElement('div');
  t.className = 'thumb' + (i===0?' active':'');
  t.innerHTML = '<span class="thumb-num">'+String(i+1).padStart(2,'0')+'</span><span class="thumb-label">'+s.title+'</span>';
  t.onclick = () => goTo(i);
  tl.appendChild(t);
});

document.addEventListener('keydown', e => {
  if (document.activeElement && document.activeElement.isContentEditable) return;
  if (e.key==='ArrowRight'||e.key==='ArrowDown') navigate(1);
  if (e.key==='ArrowLeft'||e.key==='ArrowUp') navigate(-1);
});

function applyEdit() { document.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable='true'); }
function toggleEdit() {
  editMode = !editMode;
  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('editBtn').textContent = editMode ? 'Concluir' : 'Editar';
  if (editMode) applyEdit();
  else document.querySelectorAll('[contenteditable]').forEach(el => el.contentEditable='false');
}

render(0);
</script>
</body>
</html>
